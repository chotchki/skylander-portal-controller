name: Release

# Triggered by `git tag v*.*.* && git push --tags`. Builds the
# Windows + macOS release artifacts in parallel, each with the phone
# bundle embedded (`rust-embed`), runs the fast tests, packages the
# binary (zip on Windows, tar.gz on macOS), and attaches them to a
# draft GitHub Release. Manual `workflow_dispatch` is wired to
# rehearse the pipeline — but the `release` Environment's v*.*.*
# deployment rule means a branch dispatch gets no signing secrets;
# push a throwaway v0.0.0-dryrun tag or loosen the rule first
# (docs/dev/release-signing.md → "Dry-run via workflow_dispatch").
#
# Per-platform notes:
#   - Windows = production target with the UIA driver against real
#     RPCS3 (PLAN Phase 7).
#   - macOS = production target with the mock driver only (PLAN
#     10.6); no AXUIElement-based driver port. Useful for demo,
#     family-member play, dev iteration, and the iOS-Simulator e2e
#     harness, but doesn't talk to a real RPCS3.
#
# CI (`ci.yml`) covers PRs + main pushes — clippy/build/test cycle.
# This workflow assumes that's already green for the tagged commit;
# we don't re-run clippy here, just the test suite as a sanity check.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  build-windows-release:
    name: build + release (windows)
    runs-on: windows-latest
    permissions:
      # Required to create + upload to a GitHub Release from a tag.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-release"

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # PLAN 9.1 — cached download of the standalone tailwindcss CLI.
      # See ci.yml for the rationale; same key/path here.
      - name: Cache tailwindcss CLI
        uses: actions/cache@v4
        with:
          path: phone/.tailwind-cache
          key: tailwindcss-${{ runner.os }}-${{ hashFiles('tools/tailwind-build/src/main.rs') }}

      # Phone bundle has to exist BEFORE the server build — the
      # server's `rust-embed` macro reads `phone/dist/` at compile
      # time. Release-mode trunk emits hashed filenames + minified
      # wasm so the embedded bytes match what users will run.
      - name: trunk build --release (phone bundle)
        working-directory: phone
        run: trunk build --release

      # Fast smoke pass — unit + integration tests. The
      # `#[ignore]`-gated suites (live RPCS3, e2e webdriver) need an
      # interactive desktop and aren't runnable on Actions; CI never
      # passes `-- --ignored` per CLAUDE.md.
      - name: cargo test --workspace
        # Exclude skylander-playthrough (the demo-reel SCKit capture tool): it pulls
        # screencapturekit -> apple-metal, whose Swift bridge needs the macOS-26 SDK
        # (MTLResidencySet/MTLLogState) the macos-15 runner lacks. Not shipped; the
        # release artifact is `-p skylander-server`, which doesn't depend on it.
        run: cargo test --workspace --exclude skylander-playthrough

      # `--no-default-features --features sky-stats` strips the
      # `dev-tools` feature out of the shipped exe. dev-tools is on
      # by default for `cargo run` ergonomics but relaxes security:
      # the `Signed` HMAC extractor bypasses signature checks for
      # unsigned requests, the `/api/_dev/log` endpoint accepts any
      # phone-side log payload, and `.env.dev` overrides the
      # pack/RPCS3 paths. None of that should be reachable in a
      # release build.
      #
      # `mock-driver-runtime` (same as the macOS lane below) ships the dummy
      # portal driver so `DriverKind::Mock` is constructible — it powers the
      # PLAN 19 no-GPU demo fallback + `SKYLANDER_PORTAL_DRIVER=mock` override.
      # Unlike `dev-tools` it relaxes no security gates.
      - name: cargo build --release -p skylander-server (production features)
        run: cargo build --release -p skylander-server --no-default-features --features sky-stats,mock-driver-runtime

      # PLAN 16.9.0b — v1 bundles our patched RPCS3 (the IPC control binary; stock
      # RPCS3 has no IPC listener). Pull it from the durable prerelease published by
      # rpcs3-patched.yml, verify SHA-256, extract to <workspace>/rpcs3/ — staged into
      # both the zip and the MSI below (the wizard defaults rpcs3_exe to
      # <app>/rpcs3/rpcs3.exe). Firmware + games still come from the user's own install.
      - name: Download + verify bundled patched RPCS3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'rpcs3-patched-09d602fd5'
          gh release download $tag --repo $env:GITHUB_REPOSITORY `
            --pattern 'rpcs3-patched-windows-x64.zip' `
            --pattern 'rpcs3-patched-windows-x64.zip.sha256' --dir rpcs3-dl
          if ($LASTEXITCODE -ne 0) { throw "download patched RPCS3 ($tag) failed" }
          $expected = (Get-Content rpcs3-dl/rpcs3-patched-windows-x64.zip.sha256).Split(' ')[0].Trim().ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 rpcs3-dl/rpcs3-patched-windows-x64.zip).Hash.ToLower()
          if ($actual -ne $expected) { throw "patched RPCS3 SHA-256 mismatch: expected $expected got $actual" }
          New-Item -ItemType Directory -Force -Path rpcs3 | Out-Null
          Expand-Archive -Path rpcs3-dl/rpcs3-patched-windows-x64.zip -DestinationPath rpcs3 -Force
          if (-not (Test-Path rpcs3/rpcs3.exe)) { throw "patched RPCS3 extract missing rpcs3.exe" }
          $mb = [math]::Round((Get-ChildItem rpcs3 -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "bundled patched RPCS3: $mb MB extracted"

      # PLAN 19 — bundle Mesa llvmpipe (software OpenGL) so the launcher runs on
      # GPU-less machines (winget validation VM / headless RDP). The minimal
      # llvmpipe set is `opengl32.dll` + `libgallium_wgl.dll` (dxil.dll is for
      # the d3d12 driver, not needed). We ALSO drop a copy of the launcher exe
      # into `mesa/` so a GPU-less launch can re-exec `mesa/<exe>` — its app
      # directory becomes `mesa/`, so the static `opengl32.dll` import resolves
      # to bundled Mesa (an env var alone can't redirect glutin's statically
      # linked WGL functions). See `crates/server/src/gl_fallback.rs`.
      - name: Download + verify bundled Mesa (software OpenGL fallback)
        shell: pwsh
        run: |
          $ver = '26.1.1'
          $expected = 'd5e90e9ae4d620313b61fbbf8e9a55761454e38b6501c39be6d93449c88780e1'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z"
          New-Item -ItemType Directory -Force -Path mesa-dl | Out-Null
          Invoke-WebRequest -Uri $url -OutFile mesa-dl/mesa.7z
          $actual = (Get-FileHash -Algorithm SHA256 mesa-dl/mesa.7z).Hash.ToLower()
          if ($actual -ne $expected) { throw "Mesa $ver SHA-256 mismatch: expected $expected got $actual" }
          # windows-latest ships 7-Zip (`7z` on PATH). Extract only the x64
          # llvmpipe runtime to a flat `mesa/` dir next to the exe.
          New-Item -ItemType Directory -Force -Path mesa | Out-Null
          7z e mesa-dl/mesa.7z -omesa "x64/opengl32.dll" "x64/libgallium_wgl.dll" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extract (mesa) failed: $LASTEXITCODE" }
          if (-not (Test-Path mesa/opengl32.dll)) { throw "mesa extract missing opengl32.dll" }
          if (-not (Test-Path mesa/libgallium_wgl.dll)) { throw "mesa extract missing libgallium_wgl.dll" }
          # The re-exec target: a copy of the launcher binary that runs WITH
          # `mesa/` as its application directory.
          Copy-Item "target/release/skylander-portal-controller.exe" "mesa/"
          $mb = [math]::Round((Get-ChildItem mesa -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "bundled Mesa software-GL runtime: $mb MB"

      # v1.9.8 — bundle the Visual C++ runtime app-local. A clean machine with no
      # VC++ Redistributable (the winget validation VM) can't load the Rust exe
      # (dynamic MSVC CRT) NOR the Mesa "release-msvc" DLLs → launch fails with
      # 0xC0000135 (DLL not found). Sandbox-confirmed 2026-06-10. Drop the
      # redistributable runtime DLLs next to the exe (target/release → the MSI's
      # MainExe dir via $(var.CargoTargetBinDir), and the zip root) AND into mesa/
      # (the re-exec child's application dir — heat-harvested into the MSI, and
      # copied into the zip by the existing mesa/ recurse below). These are MS
      # app-local-redistributable + a platform system library, so GPL-2.0-OK.
      - name: Stage VC++ runtime DLLs (app-local)
        shell: pwsh
        run: |
          $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT' -Directory -ErrorAction SilentlyContinue |
                   Sort-Object FullName -Descending | Select-Object -First 1
          $dlls = 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll'
          foreach ($d in $dlls) {
            $src = if ($crt) { Join-Path $crt.FullName $d } else { Join-Path $env:WINDIR "System32\$d" }
            if (-not (Test-Path $src)) { throw "VC++ runtime DLL not found: $d (looked in $src)" }
            Copy-Item $src 'target/release/' -Force
            Copy-Item $src 'mesa/' -Force
          }
          Write-Host "staged VC++ runtime DLLs from $(if ($crt) { $crt.FullName } else { 'System32 fallback' })"

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual-${env:GITHUB_SHA}".Substring(0, 14) }
          $stage = "release-stage/skylander-portal-controller-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/skylander-portal-controller.exe" "$stage/"
          # v1.9.8 — app-local VC++ runtime next to the exe (staged into
          # target/release above; mesa/ copies ride along via the recurse below).
          Copy-Item "target/release/vcruntime140.dll","target/release/vcruntime140_1.dll","target/release/msvcp140.dll","target/release/msvcp140_1.dll" "$stage/"
          Copy-Item "README.md" "$stage/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE*" "$stage/" -ErrorAction SilentlyContinue
          # Tracked-asset bundle (PLAN 10.8.6). The release binary's
          # `data_root` defaults to `<exe_parent>/data/`, so figure
          # portraits (`/api/figures/:id/image`) and game box-art
          # (`/api/games/:serial/image`) only resolve when this
          # directory ships next to the .exe. Ships the committed
          # `thumb.png` set + game PNGs + figures.json metadata;
          # `data/scanned/` and `data/images/**/hero.png` are
          # gitignored so the CI checkout doesn't include them.
          Copy-Item -Recurse "data" "$stage/"
          # PLAN 16.9.0b — bundled patched RPCS3 next to the app at rpcs3/rpcs3.exe.
          Copy-Item -Recurse "rpcs3" "$stage/"
          # PLAN 19 — bundled Mesa software-OpenGL runtime (opengl32.dll +
          # libgallium_wgl.dll + a launcher-exe copy to re-exec into).
          Copy-Item -Recurse "mesa" "$stage/"
          # PLAN 10.8.5 — Steam library artwork (apply via Steam's "Set Custom
          # Artwork"; see README). MSI ships it via heat; the zip needs it too.
          if (Test-Path "steam") { Copy-Item -Recurse "steam" "$stage/" }
          $zip = "skylander-portal-controller-$tag-windows-x86_64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload zip artifact (always)
        # Up the chain even on workflow_dispatch (no tag) so we can
        # download + smoke-test the build without publishing a release.
        # The zip is the "portable" fallback artifact (PLAN 10.9.5);
        # the MSI built below is the primary install path.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ZIP }}
          path: ${{ env.RELEASE_ZIP }}
          retention-days: 30

      # PLAN 10.9.1 — Windows .msi via cargo-wix. WiX 3 ships pre-
      # installed on windows-latest GitHub runners (path is
      # `C:\Program Files (x86)\WiX Toolset v3.*\bin`). Add it to
      # the PATH so `heat.exe` is discoverable, then harvest the
      # asset trees and link the MSI.
      - name: Locate WiX 3 toolset
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3.*' -Directory |
                   Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) {
            throw "WiX 3 toolset not found under Program Files (x86)"
          }
          $bin = Join-Path $wix.FullName 'bin'
          Write-Host "WiX bin: $bin"
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Harvest data/ + steam/ trees with heat
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wix | Out-Null
          # heat flags:
          #   -ag                auto-generate component GUIDs
          #   -srd               suppress Directory root creation
          #                      (we provide DataDir / SteamDir in main.wxs)
          #   -dr <ref>          parent directory ref id
          #   -cg <name>         component group name (matches main.wxs ref)
          #   -sfrag             suppress per-component <Fragment> wrappers
          #   -suid              suppress unique-id MD5 suffixes
          #   -var var.<name>    emit Source="$(var.<name>)\..." so light
          #                      can resolve via -d<name>=<abspath>. Without
          #                      this, paths use a literal `SourceDir\`
          #                      prefix that light resolves from cargo-wix's
          #                      cwd (`crates/server/`) — wrong for our
          #                      workspace-root data/.
          heat dir data -ag -srd -dr DataDir -cg DataFiles -sfrag -suid `
            -var var.DataSourceDir -out wix/data.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat (data) failed: $LASTEXITCODE" }
          # PLAN 16.9.0b — harvest the bundled patched RPCS3 tree into the MSI.
          heat dir rpcs3 -ag -srd -dr Rpcs3Dir -cg Rpcs3Files -sfrag -suid `
            -var var.Rpcs3SourceDir -out wix/rpcs3.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat (rpcs3) failed: $LASTEXITCODE" }
          # PLAN 19 — harvest the bundled Mesa software-GL runtime into the MSI.
          heat dir mesa -ag -srd -dr MesaDir -cg MesaFiles -sfrag -suid `
            -var var.MesaSourceDir -out wix/mesa.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat (mesa) failed: $LASTEXITCODE" }
          # steam/ doesn't exist yet (PLAN 10.8.5 not landed). Create
          # an empty wxs fragment so the cargo-wix include list still
          # resolves; harvest for real once the assets ship.
          if (Test-Path steam) {
            heat dir steam -ag -srd -dr SteamDir -cg SteamFiles -sfrag -suid `
              -var var.SteamSourceDir -out wix/steam.wxs
            if ($LASTEXITCODE -ne 0) { throw "heat (steam) failed: $LASTEXITCODE" }
          } else {
            @"
          <?xml version='1.0' encoding='windows-1252'?>
          <Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>
            <Fragment>
              <ComponentGroup Id='SteamFiles'/>
            </Fragment>
          </Wix>
          "@ | Out-File -Encoding utf8 wix/steam.wxs
          }

      - name: Build MSI with cargo-wix
        shell: pwsh
        run: |
          # On a tag push GITHUB_REF_NAME is "v1.2.3"; strip the v.
          # On workflow_dispatch it's the branch name ("main"), which
          # cargo-wix can't parse as a semver — fall back to 0.0.0 so
          # the dispatch dry-run still produces an MSI we can inspect.
          $tag = if ($env:GITHUB_REF_NAME -match '^v\d') {
            $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            '0.0.0'
          }
          $dataAbs = (Resolve-Path data).Path
          $rpcs3Abs = (Resolve-Path rpcs3).Path
          $mesaAbs = (Resolve-Path mesa).Path
          # steam/ may be absent (heat then emits an empty SteamFiles group with
          # no SteamSourceDir reference); fall back to '.' so Resolve-Path can't
          # throw and the unused -d define is harmless.
          $steamAbs = if (Test-Path steam) { (Resolve-Path steam).Path } else { '.' }
          # cargo-wix consumes the [package.metadata.wix] block in
          # crates/server/Cargo.toml plus the wxs fragments listed
          # there (main.wxs + heat-generated data.wxs / steam.wxs).
          # IMPORTANT: cargo-wix resolves the `include = [...]` paths
          # relative to its own cwd, not the manifest dir. Our paths
          # are `../../wix/main.wxs` (workspace-root relative when
          # interpreted from `crates/server/`), so we must invoke from
          # the crate dir for the includes to resolve.
          # Pass-through args:
          #   -C -ext -C WixFirewallExtension  candle: load fire: ns
          #   -L -ext -L WixFirewallExtension  light:  link fire: ext
          #   -C -dDataSourceDir=<abspath>     candle: define preprocessor
          #                                    var so heat-emitted
          #                                    Source="$(var.DataSourceDir)\..."
          #                                    paths resolve to workspace
          #                                    data/ (candle's cwd is
          #                                    crates/server/).
          # NB: WixUIExtension is auto-loaded by cargo-wix; passing it
          # explicitly causes LGHT0091 duplicate-symbol on WixUI_FeatureTree.
          Push-Location crates/server
          try {
            cargo wix -p skylander-server --no-build --nocapture --install-version $tag `
              -C -ext -C WixFirewallExtension `
              -C "-dDataSourceDir=$dataAbs" `
              -C "-dRpcs3SourceDir=$rpcs3Abs" `
              -C "-dMesaSourceDir=$mesaAbs" `
              -C "-dSteamSourceDir=$steamAbs" `
              -L -ext -L WixFirewallExtension
            if ($LASTEXITCODE -ne 0) { throw "cargo wix failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $msi = Get-ChildItem target/wix -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw "no MSI produced under target/wix" }
          $renamed = "skylander-portal-controller-$tag-windows-x86_64.msi"
          Move-Item $msi.FullName $renamed
          "RELEASE_MSI=$renamed" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload MSI artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_MSI }}
          path: ${{ env.RELEASE_MSI }}
          retention-days: 30

      - name: Publish release
        # Only on actual tag pushes — manual dispatch leaves the
        # uploaded artifacts for inspection but doesn't publish.
        # Past v1.5.x the pipeline has proven itself end-to-end on real
        # tags, so we flip straight to a regular release (drops the
        # pre-release badge); the most recent v*.*.* gets "Latest"
        # automatically.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_MSI }}
          generate_release_notes: true
          # Tag and name come from `github.ref` automatically.

      - name: Publish to winget (auto-PR to microsoft/winget-pkgs)
        # PLAN 13.4 — fires only on tag pushes, AFTER the release assets exist
        # (the action downloads the MSI from the just-published release, computes
        # its SHA-256, and opens a winget-pkgs PR via wingetcreate update). Needs
        # the WINGET_PAT secret: a fine-grained PAT on chotchki/winget-pkgs with
        # Contents + Pull requests read/write. Intentionally NOT continue-on-error
        # — a red step here is the signal that the PAT expired/missing
        # (docs/dev/winget-submission.md).
        # DISABLED 2026-06-26 (chotchki): the mac-signing patch iterations (v1.9.14+)
        # don't change the Windows MSI, so each tag would re-submit the SAME package to
        # winget — churn that risks the winget-pkgs maintainers' patience. Re-enable by
        # restoring the tag condition once a release goes fully green and there's a real
        # Windows update worth a PR. Tracked: PLAN 14.6.4.
        if: false  # was: startsWith(github.ref, 'refs/tags/v')
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ChristopherHotchkiss.SkylanderPortalController
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_PAT }}

  build-macos-release:
    name: build + release (macos)
    # macos-14 is Apple Silicon (M-series); arm64 is the only Mac
    # architecture we ship a binary for in v1. Adding x86_64 (Intel)
    # is doable later via macos-13 + a separate artifact, but ~all
    # Mac users targeted by this distribution are on Apple Silicon
    # by 2026.
    runs-on: macos-15
    # Signing live as of Phase 14 (2026-06-25): the `release` Environment holds
    # the Apple Developer ID + notarization secrets (runbook:
    # docs/dev/release-signing.md). The Windows job publishes the Release
    # independently, so a tag still produces the zip + MSI regardless.
    # `release` Environment scopes the signing/notarization secrets
    # (PLAN 10.9.2). Configure it in repo Settings → Environments →
    # release with deployment-branch restriction to `v*.*.*` tags
    # so a pushed-tag is the only way to flow secrets into this
    # job. Setup steps + secret list: docs/dev/release-signing.md.
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-release"

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # Same build order as the Windows lane: phone bundle first
      # because the server's `rust-embed` reads `phone/dist/` at
      # compile time.
      - name: trunk build --release (phone bundle)
        working-directory: phone
        run: trunk build --release

      # The chromedriver / iOS-Simulator e2e tests are #[ignore]-gated
      # so this skips them. The mac-only mdns::mac::os_hostname_resolves_via_local
      # test is also #[ignore]-gated (needs a working LAN +
      # mDNSResponder); same skip behaviour as the Windows lane's
      # live-RPCS3 ignores.
      - name: cargo test --workspace
        # Exclude skylander-playthrough (the demo-reel SCKit capture tool): it pulls
        # screencapturekit -> apple-metal, whose Swift bridge needs the macOS-26 SDK
        # (MTLResidencySet/MTLLogState) the macos-15 runner lacks. Not shipped; the
        # release artifact is `-p skylander-server`, which doesn't depend on it.
        run: cargo test --workspace --exclude skylander-playthrough

      # Production features for macOS (PLAN 10.6):
      # - `sky-stats`: same as Windows; enables the per-figure stats
      #   endpoint behind the parsed `.sky` working copies.
      # - `mock-driver-runtime`: lets `build_driver` construct
      #   `MockPortalDriver` even without `dev-tools`. Required on
      #   Mac because there's no AXUIElement-based driver — without
      #   this flag the binary would bail at startup with "mock
      #   driver only available with the dev-tools feature".
      # Drops `dev-tools` (relaxes HMAC, adds /api/_dev/log, enables
      # .env.dev parsing) — same security gates as the Windows lane.
      - name: cargo build --release -p skylander-server (production features)
        run: cargo build --release -p skylander-server --no-default-features --features sky-stats,mock-driver-runtime

      - name: Stage portable tarball (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-manual-${GITHUB_SHA:0:8}}"
          stage="release-stage/skylander-portal-controller-${tag}"
          mkdir -p "$stage"
          cp target/release/skylander-portal-controller "$stage/"
          # README + LICENSE are best-effort — keep going even if a
          # bare repo somehow lacks them.
          cp README.md "$stage/" || true
          cp LICENSE* "$stage/" 2>/dev/null || true
          # Tracked-asset bundle (PLAN 10.8.6). Same reasoning as the
          # Windows lane: release binary's `data_root` resolves to
          # `<exe_parent>/data/` so figure portraits + game box-art
          # only render when this directory ships next to the binary.
          cp -R data "$stage/"
          tarball="skylander-portal-controller-${tag}-macos-arm64.tar.gz"
          # -C + relative dir so the tar root is the staged folder
          # name, not the absolute checkout path.
          tar -czf "$tarball" -C release-stage "skylander-portal-controller-${tag}"
          echo "RELEASE_TARBALL=${tarball}" >> "$GITHUB_ENV"

      - name: Upload tarball artifact (always)
        # Portable fallback for users who'd rather not run an
        # installer (PLAN 10.9.5). Always-upload so workflow_dispatch
        # rehearsals can pull it down without publishing a release.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TARBALL }}
          path: ${{ env.RELEASE_TARBALL }}
          retention-days: 30

      # PLAN 10.9.2 / 10.9.4 — signed + notarized .dmg. The Tier-2
      # path: import the Developer ID Application cert into a
      # throwaway keychain, build the .app+.dmg with SIGN_IDENTITY
      # set so `codesign` runs inside `tools/build-macos-app.sh`,
      # then notarize the .dmg via `xcrun notarytool` and staple
      # the result so the notarization travels with the artifact
      # (offline-verifiable).
      #
      # Security model: `release` Environment scopes these secrets
      # to this job + branch-restricts deployments to `v*.*.*` tags
      # (configured in repo Settings → Environments). The
      # `github.repository == ...` guard is belt-and-suspenders so
      # if a fork ever runs this workflow, the steps no-op before
      # touching any secret.

      # Signing + notarization are LIVE (Phase 14). The `release`
      # Environment provides the Apple Developer ID + notarization
      # secrets; the `github.repository ==` guard on each step no-ops
      # them on forks before any secret is touched. Runbook:
      # docs/dev/release-signing.md.

      - name: Import Developer ID certificate
        if: github.repository == 'chotchki/skylander-portal-controller'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          # Write the .p12 to a tmp file. base64 --decode reads from
          # stdin; piping through avoids leaving the b64 blob on
          # disk where a misconfigured `actions/upload-artifact: '*'`
          # could grab it.
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Fresh keychain per run, locked after 6h (job timeout
          # cap). `set-keychain-settings -lut` = lock-on-user-timeout
          # in seconds.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # `set-key-partition-list` grants codesign + Apple tools
          # access to the imported key without prompting. Without
          # this, codesign hangs on a non-interactive runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Add the keychain to the search list so codesign finds
          # the cert by identity name.
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build signed .app + .dmg
        if: github.repository == 'chotchki/skylander-portal-controller'
        env:
          # Cert common name, e.g.
          # "Developer ID Application: Christopher Hotchkiss (TEAMID)".
          # Surfaced via secrets to keep the team-id off public CI logs.
          SIGN_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: tools/build-macos-app.sh

      - name: Notarize and staple .dmg
        if: github.repository == 'chotchki/skylander-portal-controller'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          if [[ -z "$DMG" ]]; then
            echo "no dmg found under dist/" >&2
            exit 1
          fi
          # `notarytool submit --wait` blocks until Apple's verdict (typically
          # <2min for our artifact size) but exits 0 even when the verdict is
          # Invalid — so we parse the status ourselves and, on anything but
          # Accepted, dump Apple's notary log (the authoritative issue list:
          # wrong cert type / missing timestamp / unsigned nested code) before
          # failing. App-specific password is from appleid.apple.com →
          # "Sign-in and Security" — it's NOT the Apple ID password.
          set +e
          SUBMIT_OUT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1)
          SUBMIT_RC=$?
          set -e
          printf '%s\n' "$SUBMIT_OUT"
          SUBMISSION_ID=$(printf '%s\n' "$SUBMIT_OUT" | awk '/id:/{print $2; exit}')
          if [[ "$SUBMIT_RC" -ne 0 ]] || ! printf '%s\n' "$SUBMIT_OUT" | grep -q "status: Accepted"; then
            echo "::error::Notarization not Accepted (rc=$SUBMIT_RC). Apple notary log follows:"
            if [[ -n "$SUBMISSION_ID" ]]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" || true
            fi
            exit 1
          fi
          # Staple bakes the notarization ticket into the .dmg so
          # Gatekeeper's offline check passes (the user's machine
          # doesn't need to phone Apple to verify on first launch).
          xcrun stapler staple "$DMG"
          # Final verify — `spctl -a -t open --context context:primary-signature`
          # is the same check Gatekeeper runs at launch time.
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          # Stash the path for the upload step.
          echo "RELEASE_DMG=$DMG" >> "$GITHUB_ENV"

      - name: Upload signed DMG artifact
        if: github.repository == 'chotchki/skylander-portal-controller'
        # Debug-convenience only — the release dmg is delivered by the Publish step
        # below (files:). Never let a failed artifact upload gate the release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 forbids "/" in the NAME — must be a bare label, NOT the
          # dist/… path (RELEASE_DMG, which is what tanked v1.9.17). path: takes the path.
          name: macos-signed-dmg
          path: ${{ env.RELEASE_DMG }}
          retention-days: 30

      - name: Publish release
        # Only on actual tag pushes. softprops/action-gh-release is
        # idempotent across multiple jobs uploading to the same tag —
        # whichever lane lands first creates the release, the other
        # appends. `generate_release_notes: true` is set in both;
        # whichever runs first writes the notes.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          # On a real tag the signing steps set RELEASE_DMG; on forks /
          # non-owner runs they no-op and softprops skips the missing path
          # (fail_on_unmatched_files defaults false).
          files: |
            ${{ env.RELEASE_TARBALL }}
            ${{ env.RELEASE_DMG }}
          generate_release_notes: true
