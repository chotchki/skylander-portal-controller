name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The iOS-Simulator e2e lane is label-gated on PRs and skipped on
  # push; manual dispatch lets us run it ad-hoc when investigating a
  # phone-side regression without opening a PR.
  workflow_dispatch:

# Cancel in-flight runs for the same branch / PR when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No sqlx compile-time macros are used today (the server uses runtime-checked
  # `sqlx::query_as::<_, T>(...)` everywhere), so a `.sqlx/` offline cache isn't
  # required. This flag is set defensively so that if someone introduces a
  # `sqlx::query!` macro later, the build will fail loudly here rather than
  # silently trying to connect to a non-existent dev DB.
  SQLX_OFFLINE: "true"

jobs:
  # rustfmt is platform-independent — run on Ubuntu for speed.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: cargo fmt --all --check (workspace)
        run: cargo fmt --all --check
      - name: cargo fmt --check (phone crate)
        working-directory: phone
        run: cargo fmt --all --check

  # Workspace uses Windows-only APIs (windows-sys, Win32, UIA) via
  # `crates/rpcs3-control`, so clippy/build/test must run on Windows
  # to cover the UIA driver path. Phase 10 also makes the workspace
  # build cleanly on macOS under the mock driver — the parallel
  # `clippy-build-test-macos` lane below covers that, so a regression
  # in either platform's cfg gates fails fast.
  clippy-build-test:
    name: clippy + build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with clippy + wasm target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Include feature-flag variants in the cache key so the `--all-features`
          # build doesn't poison the default cache.
          shared-key: "windows-stable"

      # PLAN 7.1 — server's `rust-embed` macro reads from
      # `phone/dist/` at compile time, so the phone bundle has to
      # exist on this runner BEFORE the server build kicks off.
      # Build it inline rather than passing artifacts between
      # runners — the install + build are ~45s, well under the
      # cross-runner artifact dance overhead.
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # PLAN 9.1 — cached download of the standalone tailwindcss CLI.
      # Trunk's pre_build hook runs `tools/tailwind-build` which fetches
      # the binary into `phone/.tailwind-cache/` on first call; we cache
      # that directory between CI runs keyed on the source file (which
      # carries `TAILWIND_VERSION`) so a version bump invalidates
      # cleanly without manual intervention.
      - name: Cache tailwindcss CLI
        uses: actions/cache@v4
        with:
          path: phone/.tailwind-cache
          key: tailwindcss-${{ runner.os }}-${{ hashFiles('tools/tailwind-build/src/main.rs') }}

      - name: trunk build --release (phone bundle)
        working-directory: phone
        run: trunk build --release

      # Clippy runs in strict mode: any warning fails the build. The workspace
      # was cleaned up end-to-end (see the clippy-cleanup PR), with narrow
      # `#[allow]`s documented where the lint was judged wrong for the code
      # (UIA automation in `crates/rpcs3-control/src/uia.rs`, `+ 0x00` spec
      # offsets in `crates/sky-parser`). New lints must be fixed before merge
      # — don't re-introduce `continue-on-error` without a very good reason.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features

      # `cargo test` skips `#[ignore]`-gated tests by default. Per CLAUDE.md,
      # the live-RPCS3 tests (crates/rpcs3-control/tests/live*.rs and parts of
      # process.rs) plus every e2e test are session-bound — they need an
      # interactive Windows desktop, a real RPCS3 install, and chromedriver —
      # so they can't run on GitHub Actions. Do NOT pass `-- --ignored`.
      - name: cargo test --workspace
        run: cargo test --workspace

  # The phone SPA is a separate (non-workspace) crate that compiles to WASM.
  # Nothing in it is Windows-only, so build it on Ubuntu for speed.
  phone-wasm:
    name: phone SPA (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "phone -> target"
          shared-key: "phone-wasm"

      - name: Install trunk
        # Binary install is ~10x faster than `cargo install trunk` from source.
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: trunk build --release
        working-directory: phone
        run: trunk build --release

  # Mac coverage of the workspace, including the production-flavored
  # release build and the Mac-only mdns/scutil branch (PLAN 10.1.6 +
  # 10.6.4). Mirrors the Windows lane structure: clippy + build + test.
  # macos-15 is Apple Silicon (M-series) — same arch as the macOS
  # release artifact ships against. (macos-15 = Xcode 16 SDK, needed by
  # tools/playthrough → screencapturekit → apple-metal; macos-14's SDK
  # lacks MTLResidencySet/MTLLogState and the Swift bridge won't build.)
  clippy-build-test-macos:
    name: clippy + build + test (macos)
    runs-on: macos-15
    # DISABLED 2026-05-30 — macOS runners bill 10x and we keep not fixing the
    # mac lane; stop burning the budget. The Windows + Ubuntu lanes already
    # cover clippy/build/test on the production driver. Re-enable by removing
    # this `if: false` once the mac build is worth maintaining again.
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with clippy + wasm target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-stable"

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: trunk build --release (phone bundle)
        working-directory: phone
        run: trunk build --release

      # Same strict-warnings policy as the Windows lane.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features

      # Skips #[ignore]-gated tests by default, same as Windows. The
      # mock-driver chromedriver suite (10.3.6) and the iOS-sim suite
      # (10.4) live in their own lanes below.
      - name: cargo test --workspace
        run: cargo test --workspace

      # Production-flavored release build (matches release.yml's
      # macOS lane). Catches feature-flag regressions in the lane
      # that actually ships to users.
      - name: cargo build --release (production features)
        run: cargo build --release -p skylander-server --no-default-features --features sky-stats,mock-driver-runtime

  # Mock-driver chromedriver e2e on Mac. Runs only the tests known to
  # be green today; the broader suite reconciliation (PLAN 10.3.6) will
  # gradually expand the --test list as each chromedriver test is
  # ported off pre-Phase-4 selectors.
  e2e-mock-macos:
    name: e2e (mock chromedriver, macos)
    runs-on: macos-14
    # DISABLED 2026-05-30 — see clippy-build-test-macos above. Re-enable by
    # removing this `if: false`.
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-e2e"

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: trunk build (phone bundle)
        working-directory: phone
        # BUILD_TOKEN pinned so the phone bundle's stale-version check
        # matches the test harness's server (TestServer::spawn passes
        # the same value via `.env("BUILD_TOKEN", "e2e-test")`).
        run: BUILD_TOKEN=e2e-test trunk build

      # The TestServer harness's `resolve_firmware_pack` requires the
      # firmware-pack directory to exist. We can't ship real `.sky`
      # files (copyright, per CLAUDE.md), but the indexer is lenient
      # — it reads each file, attempts to parse via sky-parser, and on
      # failure falls back to `FigureId::new("sha:<hash>")` and uses
      # the filename stem as the canonical name. So a tree of empty
      # stub files produces a tiny but valid library of pseudo-figures
      # we can find / click in CI tests (PLAN 10.3.6f).
      #
      # Names + folder mapping pick representative entries from the
      # tests' selectors: Spyro is the canonical-name target for
      # working_copies; the rest fill out a couple of elements + games
      # so the figure grid renders and tests that "click any card"
      # have something to click.
      - name: Generate stub firmware pack
        run: |
          set -euo pipefail
          mkdir -p "dev-data/firmware-pack/Skylanders Giants/Fire"
          mkdir -p "dev-data/firmware-pack/Skylanders Giants/Magic"
          mkdir -p "dev-data/firmware-pack/Skylanders Giants/Earth"
          mkdir -p "dev-data/firmware-pack/Skylanders Giants/Water"
          mkdir -p "dev-data/firmware-pack/Skylanders Giants/Air"
          touch "dev-data/firmware-pack/Skylanders Giants/Fire/Spyro.sky"
          touch "dev-data/firmware-pack/Skylanders Giants/Fire/Eruptor.sky"
          touch "dev-data/firmware-pack/Skylanders Giants/Magic/Voodood.sky"
          touch "dev-data/firmware-pack/Skylanders Giants/Earth/Bash.sky"
          touch "dev-data/firmware-pack/Skylanders Giants/Water/Gill Grunt.sky"
          touch "dev-data/firmware-pack/Skylanders Giants/Air/Whirlwind.sky"

      # ChromeDriver via the Chrome-for-Testing CDN — the matched
      # ChromeDriver / Chrome pair ships together so we don't get
      # the version-mismatch error a brew install would risk. Pin
      # to whatever's marked "Stable" in the channel feed.
      - name: Install matched Chrome + ChromeDriver
        shell: bash
        run: |
          set -euo pipefail
          # The macos-14 runner ships with Google Chrome installed by
          # default at /Applications/Google Chrome.app. Ask it for its
          # version and pull the exact matching ChromeDriver from the
          # CFT CDN.
          chrome_version=$(/Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version | awk '{print $3}')
          echo "Chrome version: $chrome_version"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/chromedriver.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${chrome_version}/mac-arm64/chromedriver-mac-arm64.zip"
          unzip -q /tmp/chromedriver.zip -d /tmp/cd
          mv /tmp/cd/chromedriver-mac-arm64/chromedriver "$HOME/.local/bin/chromedriver"
          chmod +x "$HOME/.local/bin/chromedriver"
          xattr -d com.apple.quarantine "$HOME/.local/bin/chromedriver" 2>/dev/null || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chromedriver" --version

      # Whitelisted to known-green tests today (PLAN 10.3.6 tracks
      # the broader reconciliation). Add more --test entries as each
      # gets a selector / DOM update.
      - name: cargo test smoke (chromedriver, mock driver)
        run: cargo test -p skylander-e2e-tests --test smoke -- --ignored --nocapture

      - name: cargo test connection_lost (chromedriver, mock driver)
        run: cargo test -p skylander-e2e-tests --test connection_lost -- --ignored --nocapture

      # profiles uses inject_profile + PIN-pad keypress + asserts on
      # game-card count — none of which need a real firmware pack.
      - name: cargo test profiles (chromedriver, mock driver)
        run: cargo test -p skylander-e2e-tests --test profiles -- --ignored --nocapture

      # The stub firmware pack from the earlier step gives the indexer
      # ~6 pseudo-figures that fail to parse but still emit Figure
      # entries with filename-derived names. Enough for the rest of
      # the suite — search for "Spyro", click "first card", count
      # `.fig-card-p4`, etc.
      #
      # working_copies::resume_prompt_offers_prior_layout is
      # `#[ignore]`-ed (PLAN 10.3.6b WIP), so filter to the green
      # test by name.
      - name: cargo test working_copies/load_uses_canonical_name
        run: |
          cargo test -p skylander-e2e-tests --test working_copies \
            load_uses_canonical_name_not_filename -- --ignored --nocapture

      - name: cargo test regressions (all 6, mock driver)
        run: cargo test -p skylander-e2e-tests --test regressions -- --ignored --nocapture

      - name: cargo test multi_phone (all 6, mock driver)
        run: cargo test -p skylander-e2e-tests --test multi_phone -- --ignored --nocapture

      # screenshot_tour writes per-scene PNGs to docs/assets/screens/
      # within the CI checkout. The runner discards those at job
      # end; what matters is the tour-script doesn't crash, which is
      # the regression contract. Stub-pack output won't match the
      # macOS-rendered baselines we committed (PLAN 10.3.4), but the
      # baselines aren't compared in CI today.
      - name: cargo test screenshot_tour (mock driver)
        run: cargo test -p skylander-e2e-tests --test screenshot_tour -- --ignored --nocapture

      # hmac + shutdown don't actually use chromedriver (no Phone
      # instances) — they exercise raw HTTP against the spawned
      # server. Run them here anyway so the chromedriver lane covers
      # the full HTTP API surface, not just selector-driven flows.
      - name: cargo test hmac (HTTP-only)
        run: cargo test -p skylander-e2e-tests --test hmac -- --ignored --nocapture

      - name: cargo test shutdown (HTTP-only)
        run: cargo test -p skylander-e2e-tests --test shutdown -- --ignored --nocapture

  # iOS-Simulator-driven e2e (PLAN 10.4). Heavy: cold-boots simulators,
  # spawns one ios_webkit_debug_proxy per device. Gated to label
  # `run-ios-sim` on PRs + manual workflow_dispatch — running on every
  # PR would dominate the macOS-minutes budget.
  e2e-ios-sim:
    name: e2e (iOS Simulator, macos)
    runs-on: macos-14
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-ios-sim'))
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-ios-sim"

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Install ios-webkit-debug-proxy
        run: brew install ios-webkit-debug-proxy

      - name: trunk build (phone bundle)
        working-directory: phone
        # BUILD_TOKEN pinned so the phone bundle's stale-version check
        # matches the test harness's server (TestServer::spawn passes
        # the same value via `.env("BUILD_TOKEN", "e2e-test")`).
        run: BUILD_TOKEN=e2e-test trunk build

      # Same stub-pack trick as the chromedriver lane (PLAN 10.3.6f).
      - name: Generate stub firmware pack
        run: |
          set -euo pipefail
          mkdir -p "dev-data/firmware-pack/Skylanders Giants/Fire"
          mkdir -p "dev-data/firmware-pack/Skylanders Giants/Magic"
          touch "dev-data/firmware-pack/Skylanders Giants/Fire/Spyro.sky"
          touch "dev-data/firmware-pack/Skylanders Giants/Fire/Eruptor.sky"
          touch "dev-data/firmware-pack/Skylanders Giants/Magic/Voodood.sky"

      # iOS runtimes pre-installed on macos-14: at least iOS 17 for
      # iPhone 15 Pro family. The ios-inspect tool's auto-pick
      # heuristic targets Dynamic-Island iPhones (15+); the matched
      # iPad runtime ships in the same Xcode bundle.
      - name: List available simulators (diagnostic)
        run: xcrun simctl list devices available

      # Run the iOS-sim tests in sequence. Each test owns a
      # TeardownGuard that shuts down its booted devices on Drop —
      # serialization here is to avoid two tests fighting over the
      # /tmp/ios-inspect-state.json file.
      - name: cargo test ios_simulator_smoke
        run: cargo test -p skylander-e2e-tests --test ios_simulator_smoke -- --ignored --nocapture

      - name: cargo test ios_pwa_hint
        run: cargo test -p skylander-e2e-tests --test ios_pwa_hint -- --ignored --nocapture

      - name: cargo test ios_two_phone
        run: cargo test -p skylander-e2e-tests --test ios_two_phone -- --ignored --nocapture
