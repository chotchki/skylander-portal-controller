name: RPCS3 patched

# PLAN 16.2.3 — guard the RPCS3 patch series (rpcs3-patches/) against silent
# patch-rot, and provide a reusable lane to build the patched emulator.
#
# Two tiers, mirroring this repo's CI philosophy (cheap always-on; heavy gated):
#   * patch-apply-check  — always-on, ~2 min. The real guard: does the series
#                          still apply cleanly onto the pinned submodule?
#   * build-{windows,macos} — manual / gated. A from-scratch patched RPCS3 build
#                          (Qt + Vulkan + LLVM + the full PS3 stack) is ~1h; it
#                          reuses upstream RPCS3's own .ci/ recipe. The canonical
#                          build remains the HTPC recipe in
#                          docs/dev/rpcs3-fork-htpc-bringup.md — these jobs are a
#                          best-effort CI mirror, opt-in so they don't burn an
#                          hour of runner time on every push.

on:
  push:
    branches: [main]
    paths:
      - 'rpcs3-patches/**'
      - 'vendor/rpcs3'          # the submodule gitlink (pin bump)
      - '.gitmodules'
      - '.gitattributes'
      - '.github/workflows/rpcs3-patched.yml'
  pull_request:
    paths:
      - 'rpcs3-patches/**'
      - 'vendor/rpcs3'
      - '.gitmodules'
      - '.gitattributes'
      - '.github/workflows/rpcs3-patched.yml'
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Also run the full patched RPCS3 build (Windows + macOS) — slow (~1h), opt-in'
        type: boolean
        default: false

concurrency:
  group: rpcs3-patched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Always-on, cheap. Checks the series applies onto the pinned upstream commit.
  # Only the main rpcs3 tree is needed (the 3 patched files live there, not in
  # 3rdparty), so the submodule is initialised NON-recursively — fast.
  # ---------------------------------------------------------------------------
  patch-apply-check:
    name: patch series applies to pinned RPCS3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with vendor/rpcs3 at the pinned commit, non-recursive)
        uses: actions/checkout@v4
        with:
          submodules: true   # vendor/rpcs3 only; NOT recursive (no 3rdparty download)

      - name: git am the patch series onto the pin
        run: bash rpcs3-patches/apply.sh

      - name: Confirm the expected files changed
        working-directory: vendor/rpcs3
        run: |
          set -euo pipefail
          # apply.sh lands one commit per patch, so the pin is HEAD~<#patches>.
          # Count dynamically so adding a patch (e.g. P3) doesn't silently skip
          # earlier commits from the diff the way a hardcoded HEAD~2 would.
          n="$(ls "$GITHUB_WORKSPACE"/rpcs3-patches/0*.patch | wc -l | tr -d ' ')"
          changed="$(git diff --name-only "HEAD~$n" HEAD | LC_ALL=C sort | tr '\n' ' ')"
          echo "changed since pin ($n patch(es)): $changed"
          # Allowlist of every file the P1-P8 series may touch, LC_ALL=C-sorted
          # (P8 adds rpcs3/Emu/CMakeLists.txt, which sorts before Cell/ only in C
          # locale — pin the sort so this comparison is deterministic). Seams:
          # P1 Skylander.{cpp,h}; P2/P7 gs_frame.cpp; P3 lv2_socket_native.cpp;
          # P5 sys_usbd.{cpp,h}; P6 pad_thread.cpp + pad_types.h; P8 Emu/CMakeLists.txt
          # + metal_layer.h + surface_publish.mm + swapchain_macos.hpp. Guards against
          # a patch sprawling beyond its intended seam.
          expected="rpcs3/Emu/CMakeLists.txt rpcs3/Emu/Cell/lv2/sys_net/lv2_socket_native.cpp rpcs3/Emu/Cell/lv2/sys_usbd.cpp rpcs3/Emu/Cell/lv2/sys_usbd.h rpcs3/Emu/Io/Skylander.cpp rpcs3/Emu/Io/Skylander.h rpcs3/Emu/Io/pad_types.h rpcs3/Emu/RSX/VK/vkutils/metal_layer.h rpcs3/Emu/RSX/VK/vkutils/surface_publish.mm rpcs3/Emu/RSX/VK/vkutils/swapchain_macos.hpp rpcs3/Input/pad_thread.cpp rpcs3/rpcs3qt/gs_frame.cpp "
          [ "$changed" = "$expected" ] || { echo "::error::unexpected patched file set"; exit 1; }
          echo "✅ series applies cleanly and touches only the expected files"

  # ---------------------------------------------------------------------------
  # Gated full build (Windows). Mirrors upstream RPCS3 .github/workflows/rpcs3.yml
  # Windows_Build: NuGet restore → .ci/setup-windows.sh (Qt/Vulkan/LLVM/ccache) →
  # msbuild rpcs3.sln. We only add: recursive submodule + apply our patch series.
  # Deploy / code-signing / cache-save steps are intentionally dropped.
  # ---------------------------------------------------------------------------
  build-windows:
    name: patched RPCS3 (Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: windows-2025   # upstream uses windows-2025-vs2026; adjust if the v143/msvc2022 toolset mismatches Qt
    permissions:
      contents: write   # publish the trimmed bin/ as the rpcs3-patched-<pin> prerelease
    defaults:
      run:
        shell: bash
    env:
      COMPILER: msvc
      QT_VER_MAIN: '6'
      QT_VER: '6.11.1'
      QT_VER_MSVC: 'msvc2022'
      QT_DATE: '202605090529'
      LLVM_VER: '19.1.7'
      VULKAN_VER: '1.4.341.1'
      VULKAN_SDK_SHA: 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe'
      CCACHE_SHA: '859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf'
      CCACHE_BIN_DIR: 'C:\ccache_bin'
      CCACHE_DIR: 'C:\ccache'
      CCACHE_INODECACHE: 'true'
      CCACHE_SLOPPINESS: 'time_macros'
      # Relative to the rpcs3 root, which for us is the working-directory
      # (vendor/rpcs3) that setup-windows.sh runs in — matching upstream RPCS3's
      # own `./dependency_cache`. (Was `./vendor/rpcs3/dependency_cache`, which
      # doubled to vendor/rpcs3/vendor/rpcs3/... from that cwd and broke `mkdir`.)
      DEPS_CACHE_DIR: ./dependency_cache
    steps:
      - name: Checkout (recursive — full build needs 3rdparty)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply patch series
        run: bash rpcs3-patches/apply.sh

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Restore NuGet packages
        working-directory: vendor/rpcs3
        run: nuget restore rpcs3.sln

      - name: Setup env (Qt / Vulkan dirs)
        shell: pwsh
        run: |
          "QTDIR=C:\Qt\${{ env.QT_VER }}\${{ env.QT_VER_MSVC }}_64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VER }}"          | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download and unpack dependencies (Qt / Vulkan / LLVM / ccache)
        working-directory: vendor/rpcs3
        run: |
          ./.ci/setup-windows.sh
          ./.ci/setup-windows-ci-vars.sh win64 msvc

      - name: Export upstream CI variables
        working-directory: vendor/rpcs3
        run: |
          while IFS='=' read -r key val; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "$key=$val" >> "$GITHUB_ENV"
          done < .ci/ci-vars.env

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile patched RPCS3
        shell: pwsh
        working-directory: vendor/rpcs3
        # Mirror upstream rpcs3.yml exactly, incl. ci_only.targets — it sets
        # DebugInformationFormat=None, which is REQUIRED for the ccache build:
        # the default /Zi shared PDB collides under the parallel /MP build
        # (UseMultiToolTask) + CLToolPath=ccache → `C1041: cannot open program
        # database`. (Path is absolute via github.workspace since cwd is the
        # submodule.)
        run: msbuild rpcs3.sln /p:Configuration=Release /v:minimal /p:Platform=x64 /p:PreferredToolArchitecture=x64 /p:CLToolPath=${{ env.CCACHE_BIN_DIR }} /p:UseMultiToolTask=true /p:CustomAfterMicrosoftCommonTargets="${{ github.workspace }}\vendor\rpcs3\buildfiles\msvc\ci_only.targets"

      - name: Upload patched rpcs3.exe (full bin/, incl. PDB — for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-patched-windows
          path: vendor/rpcs3/bin/
          if-no-files-found: warn

      # Publish the TRIMMED bin/ as the durable `rpcs3-patched-<pin>` prerelease so
      # release.yml (and users) can fetch a checksummed copy. The pin is the pristine
      # upstream commit = HEAD~<#patches> of the patched submodule (apply.sh lands one
      # commit per patch). Count dynamically so the pin stays correct as the series
      # grows. Idempotent: creates the release if absent, then clobber-uploads the
      # assets. PLAN 16.9.0b.
      - name: Publish patched RPCS3 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = (Get-ChildItem "$env:GITHUB_WORKSPACE/rpcs3-patches/0*.patch").Count
          $pin = (git -C vendor/rpcs3 rev-parse --short "HEAD~$n").Trim()
          $tag = "rpcs3-patched-$pin"
          # Trim debug/link/test artifacts (the .pdb alone is ~68 MB).
          Push-Location vendor/rpcs3/bin
          Remove-Item -Force -ErrorAction SilentlyContinue rpcs3.pdb, rpcs3.exp, rpcs3.lib
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue test
          Pop-Location
          $zip = "rpcs3-patched-windows-x64.zip"
          Compress-Archive -Path vendor/rpcs3/bin/* -DestinationPath $zip -Force
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$sha  $zip" | Out-File -Encoding ascii "$zip.sha256"
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "publishing $tag ($mb MB, sha256=$sha)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --prerelease `
              --title "Patched RPCS3 (Windows) — $pin + P1/P2 IPC patches" `
              --notes "Patched RPCS3 dependency artifact for the Skylander Portal Controller (GPL-2.0; full source in this repo, see rpcs3-patches/). Bundled by release.yml; users still supply firmware + games via their own RPCS3 install. SHA-256: $sha"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber $zip "$zip.sha256"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }

  # ---------------------------------------------------------------------------
  # Gated full build (macOS). Upstream's .ci/build-mac.sh is self-contained
  # (downloads Qt, runs cmake + build), so this job is thin: recursive submodule
  # + apply patches + run their script with the env from rpcs3.yml's Mac_Build.
  # ---------------------------------------------------------------------------
  build-macos:
    name: patched RPCS3 (macOS, Apple Silicon)
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    # macOS ships the MOCK driver — a patched mac RPCS3 is an explicit non-goal.
    # This job is a soft portability check only; its failure must not fail the run
    # (the Windows build is the product artifact). PLAN 16.8.1.
    continue-on-error: true
    runs-on: macos-14
    env:
      CCACHE_DIR: /tmp/ccache_dir
      QT_VER: '6.11.1'
      QT_VER_MAIN: '6'
      LLVM_COMPILER_VER: '21'
      AARCH64: '1'
    steps:
      - name: Checkout (recursive — full build needs 3rdparty)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply patch series
        run: bash rpcs3-patches/apply.sh

      - name: Build patched RPCS3 (upstream .ci/build-mac.sh)
        working-directory: vendor/rpcs3
        run: ./.ci/build-mac.sh

      - name: Upload patched build
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-patched-macos-arm64
          path: vendor/rpcs3/build/
          if-no-files-found: warn
