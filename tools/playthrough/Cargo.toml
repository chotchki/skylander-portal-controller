[package]
name = "skylander-playthrough"
version.workspace = true
edition.workspace = true
publish.workspace = true

# PLAN 15 — standalone dev/CI demo recorder. Never shipped in the app
# (it drives the e2e harness + a headed browser). The windows-capture
# MP4 backend (PLAN 15.10) lands on top of this scaffold.
[dependencies]
skylander-e2e-tests = { path = "../../crates/e2e-tests" }
anyhow = { workspace = true }
tokio = { workspace = true }
fantoccini = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ab_glyph = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# PLAN A.1 — macOS capture backend (the B-spike winner). The `screencapturekit`
# crate wraps SCRecordingOutput (direct-to-file) + handles the SCKit threading /
# run-loop / idle-frame filtering that raw objc2 stumbled on. swift-bridge — needs
# the Swift toolchain (already required for the Mac RPCS3 build) and a Swift-runtime
# rpath on the consuming binary (build.rs). macOS 15+ for the recording output.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_15_0"] }

# PLAN 15.10 — whole-desktop MP4 capture (Windows.Graphics.Capture + built-in
# encoder, no external ffmpeg). MIT → GPL-2.0-compatible. Windows-only; the
# capture module is cfg-stubbed elsewhere so the workspace still builds on mac.
[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
# PLAN 15.14 — Win32 window tiling for the recorder (per-monitor-v2 DPI
# awareness, SPI_GETWORKAREA, EnumWindows exact-title find, SetWindowPos,
# DWM frame-bounds compensation + cloak filtering, primary-monitor DPI).
# Windows-only; stage.rs carries the non-Windows stubs (capture.rs pattern).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
