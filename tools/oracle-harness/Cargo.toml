[package]
name = "oracle-harness"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# openspec AF (design decisions 5 and 6). Dev tool: drives the patched RPCS3
# oracle from an isolated HOME (home setup, the launch wrapper, the PINE client)
# and writes only outside any work tree of this repo. Never shipped; nothing in
# guacamole links it. The pure half (scripts, traces, comparisons) is
# crates/guac-oracle.

[lib]
name = "oracle_harness"
path = "src/lib.rs"
# No doctests here, so `cargo test` skips the empty doc-test run (openspec AQ.36);
# a doc example meant to run drops this, and .githooks/no-doctests.sh fails the
# push until it does.
doctest = false

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# The roster off the dump, the sweep's figure list (AE.22).
guac-extract = { path = "../../crates/guac-extract" }
# Level 213's placements off the dump, where a route's census finds them (AH.8);
# live_level (AG.7) reads the level the same way.
guac-formats = { path = "../../crates/guac-formats" }
guac-ir = { path = "../../crates/guac-ir" }
# The input-script format (AF.7) a schedule is loaded from, and a pad's DS3 words.
guac-oracle = { path = "../../crates/guac-oracle" }
# A SCREENSHOT's PNG, decoded to check it's a whole frame and to hash its pixels.
image = { version = "0.25", default-features = false, features = ["png"] }
# A route (AH.7) and the driver's knobs, read as RON like an input script.
ron = "0.12"
# The work-tree refusal every harness output goes through.
rrc-dump = { path = "../rrc-dump" }
# RpcsProcess (the launch and its lifecycle), the P1 codec and IpcPortalDriver.
skylander-rpcs3-control = { path = "../../crates/rpcs3-control" }
# A peek of the RNG (AF.8) as a file `oracle rng distance` and `origin` read back.
serde = { workspace = true }
serde_json = { workspace = true }
# The oracle binary's hash for the identity line, and a screenshot's pixel hash.
sha2 = { workspace = true }
thiserror = { workspace = true }

# SlotIndex, for a replay's P1 LOAD through the PortalDriver trait (and
# live_gameplay's LOAD and CLEAR).
skylander-core = { path = "../../crates/core" }

[dev-dependencies]
tempfile = "3"
