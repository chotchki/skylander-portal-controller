# Standalone tool — intentionally NOT part of the root Cargo workspace.
# Run with: `cargo run --manifest-path tools/ios-inspect/Cargo.toml -- <cmd>`
# Or `cd tools/ios-inspect && cargo run -- <cmd>`.
#
# Mac-only dev tool for iterating on iOS-specific phone UI bugs against the
# iOS Simulator. See PLAN.md §4.21 + README.md.
[workspace]

[package]
name = "ios-inspect"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
# Lets `crates/e2e-tests/` depend on the same modules the CLI uses,
# so the iOS-sim e2e tests get type-safe access to boot / open /
# screenshot rather than shelling out to the binary (PLAN 10.4.1).
# Crate name underscored so callers `use ios_inspect::…` (Cargo
# converts hyphens to underscores in package → crate names by
# default; pinning explicitly here keeps the rename obvious).
name = "ios_inspect"
path = "src/lib.rs"

[[bin]]
name = "ios-inspect"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "process", "fs"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
