[package]
name = "rrc-dump"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# AC.3 (openspec/changes/ac-giants-decode-gate, design decision 3). Dev tool:
# reads an RPCS3 RSX capture (RRC v6) and writes each draw's vertex arrays,
# index range, texture surfaces and vertex-program constants, and since AE.11
# its programs, pipeline state and clears, to a directory OUTSIDE the repo.
# Never shipped. The format notes live in FORMAT.md (src/lib.rs's docs).

[lib]
path = "src/lib.rs"
# No doctests here, so `cargo test` skips the empty doc-test run (openspec AQ.36);
# a doc example meant to run drops this, and .githooks/no-doctests.sh fails the
# push until it does.
doctest = false

[[bin]]
name = "rrc-dump"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
flate2 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
