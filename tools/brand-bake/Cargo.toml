[package]
name = "skylander-brand-bake"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skylander-brand-bake"
path = "src/main.rs"

# One-shot author-machine tool that turns the hand-authored brand SVGs in
# `assets/branding/` (logo, icon, character, background plates — PR #3, by
# Alicea Hotchkiss) into the artifacts the distribution actually consumes:
#
#   outline   -> rewrites the text-bearing SVGs with the glyphs flattened to
#                vector <path>s (self-contained, font-independent). Run this
#                on a machine that has the brand fonts available:
#                  - Titan One  : crates/server/assets/fonts/TitanOne-Regular.ttf
#                  - Georgia    : a Windows system font (C:\Windows\Fonts)
#   icon      -> assets/branding/icon.ico  (Windows multi-res 16..256)
#                assets/branding/icon.icns (macOS RGBA32 modern set)
#                baked from assets/branding/icon-1024.svg
#   steam     -> steam/*.png  (capsule / hero / header / logo / icon) composed
#                from the outlined brand SVGs
#
# Outputs are committed; the release pipeline consumes the committed files so
# CI never needs resvg/ico/icns or the brand fonts. Re-run after editing a
# source SVG.  Supersedes tools/installer-bake (icon) + tools/steam-art (steam).

[dependencies]
anyhow = { workspace = true }
ico = "0.5"
icns = "0.4"
resvg = "0.43"
