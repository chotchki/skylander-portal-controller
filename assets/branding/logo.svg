<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <!-- Titan One from Google Fonts embedded as a web font reference -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Titan+One&amp;display=swap');
    </style>
  </defs>

  <!-- SKYLANDER — ink stroke layer -->
  <text
    x="640" y="210"
    text-anchor="middle"
    font-family="'Titan One', cursive"
    font-size="190"
    letter-spacing="8"
    fill="none"
    stroke="#3a2500"
    stroke-width="22"
    stroke-linejoin="round"
  >SKYLANDER</text>

  <!-- SKYLANDER — gold stroke layer -->
  <text
    x="640" y="210"
    text-anchor="middle"
    font-family="'Titan One', cursive"
    font-size="190"
    letter-spacing="8"
    fill="none"
    stroke="#f5c634"
    stroke-width="10"
    stroke-linejoin="round"
  >SKYLANDER</text>

  <!-- SKYLANDER — fill layer (Option D: soft gold-white) -->
  <text
    x="640" y="210"
    text-anchor="middle"
    font-family="'Titan One', cursive"
    font-size="190"
    letter-spacing="8"
    fill="#fdf5dc"
  >SKYLANDER</text>

  <!-- Gold rule lines + diamond -->
  <line x1="80" y1="238" x2="556" y2="238" stroke="#f5c634" stroke-width="1.5" opacity="0.65"/>
  <line x1="724" y1="238" x2="1200" y2="238" stroke="#f5c634" stroke-width="1.5" opacity="0.65"/>
  <polygon points="640,229 652,238 640,247 628,238" fill="#f5c634" opacity="0.9"/>

  <!-- PORTAL CONTROLLER — ink stroke -->
  <text
    x="640" y="298"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="52"
    font-weight="600"
    letter-spacing="18"
    fill="none"
    stroke="#3a2500"
    stroke-width="8"
    stroke-linejoin="round"
  >PORTAL CONTROLLER</text>

  <!-- PORTAL CONTROLLER — gold fill -->
  <text
    x="640" y="298"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="52"
    font-weight="600"
    letter-spacing="18"
    fill="#f5c634"
  >PORTAL CONTROLLER</text>

  <!-- PORTAL CONTROLLER — subtle highlight stroke -->
  <text
    x="640" y="298"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="52"
    font-weight="600"
    letter-spacing="18"
    fill="none"
    stroke="#ffe58a"
    stroke-width="1"
    opacity="0.45"
  >PORTAL CONTROLLER</text>
</svg>
