  <polygon points="1000,494 1046,540 1000,586 954,540" fill="#0b1e52"/>
  <polygon points="1000,508 1032,540 1000,572 968,540" fill="url(#portalCore)" opacity="0.8"/>
  <circle cx="1000" cy="540" r="18" fill="#8fd4ff" opacity="0.7"/>
  <circle cx="1000" cy="540" r="10" fill="#ffffff" opacity="0.9"/>
  <!-- Side finials -->
  <polygon points="650,540 680,500 710,540 680,580" fill="url(#goldV)"/>
  <circle cx="680" cy="540" r="12" fill="#f5c634" opacity="0.8"/>
  <polygon points="1290,540 1320,500 1350,540 1320,580" fill="url(#goldV)"/>
  <circle cx="1320" cy="540" r="12" fill="#f5c634" opacity="0.8"/>
