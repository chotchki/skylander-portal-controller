  <polygon points="1220,2360 1320,2360 1320,620 1220,620" fill="url(#pillarL)"/>
  <polygon points="1200,640 1340,640 1320,620 1220,620" fill="url(#goldH)"/>
  <polygon points="1200,640 1340,640 1350,620 1190,620" fill="url(#baseTop)" opacity="0.6"/>
  <polygon points="1200,2380 1340,2380 1320,2360 1220,2360" fill="url(#goldH)"/>
  <line x1="1246" y1="640" x2="1246" y2="2360" stroke="#ffe58a" stroke-width="1"   opacity="0.30"/>
  <line x1="1270" y1="640" x2="1270" y2="2360" stroke="#ffe58a" stroke-width="0.8" opacity="0.20"/>
  <line x1="1294" y1="640" x2="1294" y2="2360" stroke="#3a2500" stroke-width="1"   opacity="0.40"/>
  <rect x="1220" y="900"  width="100" height="12" fill="url(#goldH)" opacity="0.8"/>
  <rect x="1220" y="1300" width="100" height="12" fill="url(#goldH)" opacity="0.8"/>
  <rect x="1220" y="1700" width="100" height="12" fill="url(#goldH)" opacity="0.8"/>
