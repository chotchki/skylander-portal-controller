  <polygon points="460,2780 1540,2780 1520,2760 480,2760" fill="url(#stepTop)"/>
  <polygon points="480,2760 1520,2760 1460,2720 540,2720" fill="url(#stepFront)"/>
  <polygon points="540,2720 1460,2720 1440,2700 560,2700" fill="url(#stepTop)"/>
  <polygon points="560,2700 1440,2700 1380,2660 620,2660" fill="url(#stepFront)"/>
  <polygon points="620,2660 1380,2660 1360,2640 640,2640" fill="url(#stepTop)"/>

