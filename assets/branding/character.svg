<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="3000" viewBox="0 0 2000 3000">
  <defs>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%"  stop-color="#c8f0ff" stop-opacity="0.95"/>
      <stop offset="40%"  stop-color="#4ec0ff" stop-opacity="0.80"/>
      <stop offset="70%"  stop-color="#1a4fa0" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4ec0ff" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#4ec0ff" stop-opacity="0"/>
      <stop offset="78%"  stop-color="#8fd4ff" stop-opacity="0.45"/>
      <stop offset="88%"  stop-color="#c8f0ff" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#ffffff"  stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe58a"/>
      <stop offset="40%"  stop-color="#f5c634"/>
      <stop offset="100%" stop-color="#7a4e00"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c58c18"/>
      <stop offset="30%"  stop-color="#ffe58a"/>
      <stop offset="70%"  stop-color="#f5c634"/>
      <stop offset="100%" stop-color="#c58c18"/>
    </linearGradient>
    <linearGradient id="goldArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe58a"/>
      <stop offset="50%"  stop-color="#f5c634"/>
      <stop offset="100%" stop-color="#3a2500"/>
    </linearGradient>
    <linearGradient id="pillarL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1a0e00"/>
      <stop offset="25%"  stop-color="#7a4e00"/>
      <stop offset="55%"  stop-color="#f5c634"/>
      <stop offset="75%"  stop-color="#c58c18"/>
      <stop offset="100%" stop-color="#3a2500"/>
    </linearGradient>
    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3a2500"/>
      <stop offset="20%"  stop-color="#c58c18"/>
      <stop offset="50%"  stop-color="#ffe58a"/>
      <stop offset="80%"  stop-color="#c58c18"/>
      <stop offset="100%" stop-color="#3a2500"/>
    </linearGradient>
    <linearGradient id="baseFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c58c18"/>
      <stop offset="40%"  stop-color="#7a4e00"/>
      <stop offset="100%" stop-color="#1a0e00"/>
    </linearGradient>
    <linearGradient id="stepTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a1a00"/>
      <stop offset="50%"  stop-color="#c58c18"/>
      <stop offset="100%" stop-color="#2a1a00"/>
    </linearGradient>
    <linearGradient id="stepFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a4e00"/>
      <stop offset="100%" stop-color="#0e0900"/>
    </linearGradient>
    <linearGradient id="crystalB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8fd4ff" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#1a4fa0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0.4"/>
