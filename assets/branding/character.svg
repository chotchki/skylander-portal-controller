  <polygon points="660,2380 1340,2380 1320,2360 680,2360" fill="url(#baseTop)"/>
  <polygon points="640,2640 660,2380 680,2360 660,2600" fill="#2a1a00" opacity="0.8"/>
  <polygon points="1360,2640 1340,2380 1320,2360 1340,2600" fill="#1a0e00" opacity="0.9"/>
  <!-- Runes -->
  <g opacity="0.7">
    <ellipse cx="1000" cy="2510" rx="22" ry="22" fill="url(#runeGlow)"/>
    <line x1="1000" y1="2488" x2="1000" y2="2532" stroke="#8fd4ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="978"  y1="2510" x2="1022" y2="2510" stroke="#8fd4ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="984"  y1="2494" x2="1016" y2="2526" stroke="#8fd4ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="1016" y1="2494" x2="984"  y2="2526" stroke="#8fd4ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="820" cy="2510" rx="16" ry="16" fill="url(#runeGlow)"/>
    <polygon points="820,2494 834,2522 806,2522" fill="none" stroke="#8fd4ff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="1180" cy="2510" rx="16" ry="16" fill="url(#runeGlow)"/>
    <polygon points="1180,2494 1194,2510 1180,2526 1166,2510" fill="none" stroke="#8fd4ff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <polygon points="660,2395 1340,2395 1340,2380 660,2380" fill="url(#goldH)" opacity="0.9"/>

  <!-- CRYSTALS LEFT -->
  <polygon points="580,2640 560,2520 590,2510 610,2610" fill="url(#crystalB)" opacity="0.85"/>
  <polygon points="550,2660 520,2560 548,2548 565,2640" fill="url(#crystalB)" opacity="0.65"/>
  <polygon points="610,2620 598,2530 622,2522 632,2600" fill="url(#crystalB)" opacity="0.75"/>
  <polygon points="490,2680 468,2580 498,2565 515,2660" fill="url(#crystalG)" opacity="0.70"/>
  <polygon points="530,2650 510,2568 534,2558 548,2630" fill="url(#crystalP)" opacity="0.60"/>
  <!-- CRYSTALS RIGHT -->
  <polygon points="1420,2640 1440,2520 1410,2510 1390,2610" fill="url(#crystalB)" opacity="0.85"/>
  <polygon points="1450,2660 1480,2560 1452,2548 1435,2640" fill="url(#crystalB)" opacity="0.65"/>
  <polygon points="1390,2620 1402,2530 1378,2522 1368,2600" fill="url(#crystalB)" opacity="0.75"/>
  <polygon points="1510,2680 1532,2580 1502,2565 1485,2660" fill="url(#crystalR)" opacity="0.70"/>
  <polygon points="1470,2650 1490,2568 1466,2558 1452,2630" fill="url(#crystalP)" opacity="0.60"/>

  <!-- LEFT PILLAR -->
  <polygon points="680,2360 780,2360 780,620 680,620" fill="url(#pillarL)"/>
  <polygon points="660,640 800,640 780,620 680,620" fill="url(#goldH)"/>
  <polygon points="660,640 800,640 810,620 650,620" fill="url(#baseTop)" opacity="0.6"/>
  <polygon points="660,2380 800,2380 780,2360 680,2360" fill="url(#goldH)"/>
  <line x1="706" y1="640" x2="706" y2="2360" stroke="#ffe58a" stroke-width="1"   opacity="0.30"/>
  <line x1="730" y1="640" x2="730" y2="2360" stroke="#ffe58a" stroke-width="0.8" opacity="0.20"/>
  <line x1="754" y1="640" x2="754" y2="2360" stroke="#3a2500" stroke-width="1"   opacity="0.40"/>
  <rect x="680" y="900"  width="100" height="12" fill="url(#goldH)" opacity="0.8"/>
  <rect x="680" y="1300" width="100" height="12" fill="url(#goldH)" opacity="0.8"/>
  <rect x="680" y="1700" width="100" height="12" fill="url(#goldH)" opacity="0.8"/>
  <rect x="680" y="2100" width="100" height="12" fill="url(#goldH)" opacity="0.8"/>

