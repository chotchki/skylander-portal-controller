    <linearGradient id="crystalG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a0ffb0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a3a10" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="crystalP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4a0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2a0050" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="crystalR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff9a70" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a1000" stop-opacity="0.5"/>
