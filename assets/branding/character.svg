  <ellipse cx="1000" cy="1490" rx="320" ry="390" fill="url(#portalRing)" opacity="0.4"/>
  <!-- Gold bezel ring -->
  <ellipse cx="1000" cy="1490" rx="300" ry="362" fill="none" stroke="url(#goldH)" stroke-width="18"/>
  <ellipse cx="1000" cy="1490" rx="292" ry="354" fill="none" stroke="#c58c18" stroke-width="3" opacity="0.6"/>
  <ellipse cx="1000" cy="1490" rx="285" ry="347" fill="none" stroke="#ffe58a" stroke-width="1.5" opacity="0.4"/>

  <!-- Gold highlight arc — near the top of the bezel ellipse -->
  <!-- endpoints calculated to lie on the bezel ellipse (cx=1000,cy=1490,rx=300,ry=362) -->
  <path d="M 820,1200 A 300,362 0 0,1 1180,1200"
    fill="none" stroke="#ffe58a" stroke-width="6" opacity="0.70" stroke-linecap="round"/>
  <path d="M 868,1165 A 300,362 0 0,1 1132,1165"
    fill="none" stroke="#ffe58a" stroke-width="3" opacity="0.40" stroke-linecap="round"/>

  <!-- Energy sparks rising from portal top — short upward dashes, no swooping curves -->
  <line x1="880"  y1="1148" x2="860"  y2="1080" stroke="#8fd4ff" stroke-width="2.5" opacity="0.50" stroke-linecap="round"/>
  <line x1="940"  y1="1132" x2="928"  y2="1060" stroke="#c8f0ff" stroke-width="2"   opacity="0.40" stroke-linecap="round"/>
  <line x1="1000" y1="1128" x2="1000" y2="1055" stroke="#ffffff"  stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
  <line x1="1060" y1="1132" x2="1072" y2="1060" stroke="#c8f0ff" stroke-width="2"   opacity="0.40" stroke-linecap="round"/>
  <line x1="1120" y1="1148" x2="1140" y2="1080" stroke="#8fd4ff" stroke-width="2.5" opacity="0.50" stroke-linecap="round"/>
  <!-- Spark dots at tips -->
  <circle cx="860"  cy="1078" r="4" fill="#8fd4ff" opacity="0.7"/>
  <circle cx="928"  cy="1058" r="3" fill="#c8f0ff" opacity="0.6"/>
  <circle cx="1000" cy="1053" r="5" fill="#ffffff"  opacity="0.8"/>
  <circle cx="1072" cy="1058" r="3" fill="#c8f0ff" opacity="0.6"/>
  <circle cx="1140" cy="1078" r="4" fill="#8fd4ff" opacity="0.7"/>

  <!-- FLOATING ORB -->
  <circle cx="1000" cy="300" r="120" fill="url(#portalCore)" opacity="0.35"/>
  <circle cx="1000" cy="300" r="80"  fill="#0b1e52"/>
  <circle cx="1000" cy="300" r="74"  fill="url(#portalCore)" opacity="0.85"/>
  <ellipse cx="1000" cy="300" rx="74" ry="26" fill="none" stroke="#f5c634" stroke-width="5" opacity="0.9"/>
  <ellipse cx="1000" cy="300" rx="60" ry="21" fill="none" stroke="#ffe58a" stroke-width="2" opacity="0.5"/>
  <circle cx="1000" cy="300" r="28" fill="#ffffff" opacity="0.9"/>
  <circle cx="980"  cy="282" r="12"  fill="#ffffff" opacity="0.5"/>
  <line x1="1000" y1="380" x2="1000" y2="540"
    stroke="#8fd4ff" stroke-width="3" opacity="0.40" stroke-dasharray="12,8"/>
  <circle cx="940"  cy="240" r="5" fill="#f5c634" opacity="0.8"/>
  <circle cx="1068" cy="260" r="4" fill="#8fd4ff" opacity="0.7"/>
  <circle cx="958"  cy="368" r="4" fill="#d4a0ff" opacity="0.7"/>
  <circle cx="1050" cy="355" r="3" fill="#a0ffb0" opacity="0.6"/>
  <circle cx="910"  cy="310" r="3" fill="#ff9a70" opacity="0.6"/>
</svg>
