  <polygon points="668,620 692,560 730,540 768,560 792,620" fill="url(#goldV)"/>
  <circle cx="692" cy="572" r="8" fill="#8fd4ff" opacity="0.85"/>
  <circle cx="730" cy="556" r="10" fill="#f5c634" opacity="0.9"/>
  <circle cx="768" cy="572" r="8" fill="#d4a0ff" opacity="0.85"/>
  <polygon points="1208,620 1232,560 1270,540 1308,560 1332,620" fill="url(#goldV)"/>
  <circle cx="1232" cy="572" r="8" fill="#a0ffb0" opacity="0.85"/>
  <circle cx="1270" cy="556" r="10" fill="#f5c634" opacity="0.9"/>
  <circle cx="1308" cy="572" r="8" fill="#ff9a70" opacity="0.85"/>

  <!-- PORTAL OPENING -->
  <!-- Portal is centred at cx=1000, cy=1490, rx=280, ry=340 -->
