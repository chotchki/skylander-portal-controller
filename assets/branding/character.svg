  <ellipse cx="1000" cy="1490" rx="280" ry="340" fill="url(#portalCore)" opacity="0.9"/>
  <!-- Vortex rings — concentric, matching the ellipse shape -->
  <ellipse cx="1000" cy="1490" rx="240" ry="290" fill="none" stroke="#8fd4ff" stroke-width="4" opacity="0.60"/>
  <ellipse cx="1000" cy="1490" rx="190" ry="230" fill="none" stroke="#c8f0ff" stroke-width="3" opacity="0.55"/>
  <ellipse cx="1000" cy="1490" rx="140" ry="170" fill="none" stroke="#ffffff"  stroke-width="2.5" opacity="0.45"/>
  <ellipse cx="1000" cy="1490" rx="90"  ry="110" fill="none" stroke="#ffffff"  stroke-width="2" opacity="0.40"/>
  <ellipse cx="1000" cy="1490" rx="45"  ry="55"  fill="none" stroke="#ffffff"  stroke-width="2" opacity="0.50"/>
  <!-- Portal core -->
