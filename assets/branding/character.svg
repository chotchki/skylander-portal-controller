    <radialGradient id="runeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4ec0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4ec0ff" stop-opacity="0"/>
