[package]
name = "guac-extract"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Turns the user's own disc dump into what guacamole plays (openspec AB, design
# decision 1). The library is what guacamole calls on first run; the bin is
# the same code from a terminal. This crate owns the filesystem, hashing, the
# manifest and ffmpeg; the parsing lives in guac-formats.
[lib]
name = "guac_extract"
path = "src/lib.rs"
# No doctests here, so `cargo test` skips the empty doc-test run (openspec AQ.36);
# a doc example meant to run drops this, and .githooks/no-doctests.sh fails the
# push until it does.
doctest = false

[[bin]]
name = "guac-extract"
path = "src/main.rs"

[dependencies]
guac-formats = { path = "../guac-formats" }
guac-ir = { path = "../guac-ir" }
serde = { workspace = true }
serde_json = { workspace = true }
# 0.11, not the workspace's 0.10: 0.11 picks the ARMv8 SHA instructions at run
# time (0.10 only with its C `asm` feature), about 4x a core on the M3 Max.
sha2 = "0.11"
thiserror = { workspace = true }
# The unknown-dump report's file name stamp.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The portraits the phone shows (AE.3): Bevy's image loader already pulls
# this version in, so it adds no crate to the lock.
png = "0.18"

[dev-dependencies]
# The game-magic guard (tests/no_game_bytes.rs) inflates gzip and zstd heads
# (RPCS3's `.rrc.gz` captures and `.SAVESTAT.zst` savestates) and builds
# throwaway git repos to test itself in. zstd (libzstd, built by zstd-sys)
# rather than the pure-Rust ruzstd: ruzstd releases nothing of a frame until it
# has decoded a whole window past it, more than the head the guard reads.
flate2 = "1"
zstd = "0.13"
tempfile = "3"
# SfoBuilder, for the synthetic dumps the identity tests build.
guac-formats = { path = "../guac-formats", features = ["test-fixtures"] }
