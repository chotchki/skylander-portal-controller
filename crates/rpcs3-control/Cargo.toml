[package]
name = "skylander-rpcs3-control"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
skylander-core = { path = "../core" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# SIGTERM-based graceful shutdown for the real Unix RPCS3 process (process_unix).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.20"
# Blocking AF_UNIX UnixStream/UnixListener for Windows (Win10 1803+/Win11),
# mirroring std::os::unix::net. Used by the IPC portal driver (PLAN 16.5) to
# talk to the patched RPCS3's AF_UNIX socket. Chosen over the async
# `uds-stream-windows` (0.0.1, unproven) because the PortalDriver trait is
# synchronous and the server already drives it inside spawn_blocking; `uds_windows`
# 1.x is mature (zbus depends on it). On unix we use std's UnixStream directly.
uds_windows = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Graphics_Gdi",
] }

[features]
default = []
mock = []
# Synthetic feature gating the Windows-only manual probes under
# `examples/`. They use `#![cfg(windows)]` at the crate level, so on
# non-Windows targets the file body vanishes and Cargo errors with
# "no main function". Listing each example with
# `required-features = ["uia-examples"]` makes Cargo skip them unless
# the flag is set, so `cargo check --all-targets` is clean on macOS.
# Windows contributors who want to build the probes use:
#   cargo build -p skylander-rpcs3-control --examples --features uia-examples
uia-examples = []

[[example]]
name = "boot_game"
required-features = ["uia-examples"]

[[example]]
name = "boot_via_eboot"
required-features = ["uia-examples"]

[[example]]
name = "production_open_dialog"
required-features = ["uia-examples"]

[[example]]
name = "dump_menu_tree"
required-features = ["uia-examples"]

[[example]]
name = "hide_dialog"
required-features = ["uia-examples"]

[[example]]
name = "library_probe"
required-features = ["uia-examples"]

[[example]]
name = "open_skylanders_dialog"
required-features = ["uia-examples"]

[[example]]
name = "rpcs3_windows"
required-features = ["uia-examples"]

[[example]]
name = "show_main"
required-features = ["uia-examples"]

