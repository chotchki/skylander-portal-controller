[package]
name = "guac-script"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The tfbScript interpreter, pure (openspec AH.14, design decisions 3 and 21):
# the original's scripts run over AH.13's op graphs, members through a host
# trait. No Bevy and no I/O: guacamole implements the host over its ECS
# queries, the tests over plain structs.
[lib]
name = "guac_script"
path = "src/lib.rs"
# No doctests here, so `cargo test` skips the empty doc-test run (openspec AQ.36);
# a doc example meant to run drops this, and .githooks/no-doctests.sh fails the
# push until it does.
doctest = false

[dependencies]
guac-formats = { path = "../guac-formats" }
thiserror = { workspace = true }

[dev-dependencies]
# The op-graph writer (`guac_formats::script::builder`) the unit tests build
# their scripts with.
guac-formats = { path = "../guac-formats", features = ["test-fixtures"] }
# The oracle's MT19937 model (`guac_oracle::rng`), the reference the
# generator is checked against (AH.15).
guac-oracle = { path = "../guac-oracle" }
# This crate's own test switches, for its unit tests.
guac-script = { path = ".", features = ["test-fixtures"] }

[features]
# Test switches: `Members::without`, a member taken out of a run's registry so
# a script stops where its absence stopped it (guacamole's disc tests hold the
# fall-back to the stop at `Minion.ai` #842 that AG.160 took away). Test-only:
# guacamole's tests enable it from their [dev-dependencies], and its
# `test-hooks` builds through its `unmodel` feature (AG.221's
# `GUAC_TEST_UNMODEL`); nothing that ships does.
test-fixtures = []
