[package]
name = "guacamole"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The native Skylanders app (openspec AA, design decision 7): a Bevy TV that
# boots the shared server (`guac-server`) with the native driver.
[[bin]]
name = "guacamole"
path = "src/main.rs"

[dependencies]
# Default features off: `dev-tools` / `test-hooks` below forward to it, so a
# `--no-default-features` release build can't pick up the library's dev defaults.
guac-server = { path = "../guac-server", default-features = false }
skylander-core = { path = "../core" }
skylander-rpcs3-control = { path = "../rpcs3-control" }

anyhow = { workspace = true }
tracing = { workspace = true }
# The native driver → TV channel: bounded, and its `Receiver` is `Sync`, so it
# sits in a plain Bevy `Resource` (design decision 4).
crossbeam-channel = "0.5"

# Pinned by Cargo.lock; upgrades are their own change at milestone boundaries.
# `ui` is the 2D UI collection (winit, wgpu, bevy_ui, text, png); no 3D or audio yet.
bevy = { version = "0.20.0", default-features = false, features = ["ui"] }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = ["dev-tools"]
# `cargo run` builds: `./dev-data/guacamole/`, `.env.dev`, unsigned requests,
# a console window on Windows.
dev-tools = ["guac-server/dev-tools"]
# The /api/_test/* endpoints for the e2e harness. Never in release builds.
test-hooks = ["dev-tools", "guac-server/test-hooks"]
