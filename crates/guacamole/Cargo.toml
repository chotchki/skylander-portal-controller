[package]
name = "guacamole"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The native Skylanders app (openspec AA, design decision 7): a Bevy TV that
# boots the shared server (`guac-server`) with the native driver.
[[bin]]
name = "guacamole"
path = "src/main.rs"

# What the binary, its examples and its GPU lanes share (openspec AE.8): the
# character material, its WESL shader and the meshes built from IR.
[lib]
name = "guacamole"
path = "src/lib.rs"

[dependencies]
# Default features off: `dev-tools` / `test-hooks` below forward to it, so a
# `--no-default-features` release build can't pick up the library's dev defaults.
guac-server = { path = "../guac-server", default-features = false }
skylander-core = { path = "../core" }
skylander-rpcs3-control = { path = "../rpcs3-control" }
# First-run extraction (openspec AB.9): identity, the intro index, the transcode.
guac-extract = { path = "../guac-extract" }
guac-ir = { path = "../guac-ir" }
# The level's script part (openspec AH.22): parsed by guac-formats' readers
# and linked by guac-script at level load.
guac-formats = { path = "../guac-formats" }
guac-script = { path = "../guac-script" }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The native driver → TV channel: bounded, and its `Receiver` is `Sync`, so it
# sits in a plain Bevy `Resource` (design decision 4).
crossbeam-channel = "0.5"
# `/api/_test/tv` (AA.10): an extra route on the shared server, its body JSON.
axum = "0.7"
serde = { workspace = true }

# Pinned by Cargo.lock; upgrades are their own change at milestone boundaries.
# `ui` is the 2D UI collection (winit, gilrs, wgpu, bevy_ui, text, png); audio
# and `mp3` play the intros' sound (AB.10). The 3D set draws the characters
# (AE.8): `bevy_pbr`'s material pipeline and skinning, `bevy_light`, `ktx2`
# for the extract's textures (it refuses to build without a zstd backend,
# though ours never compresses) and the tonemapping LUTs TonyMcMapface reads.
bevy = { version = "0.20.0", default-features = false, features = [
    "ui",
    "bevy_audio",
    "mp3",
    "bevy_pbr",
    "bevy_light",
    "ktx2",
    "zstd_rust",
    "tonemapping_luts",
] }
# The setup screen's folder picker (AA.15): a sheet on the window while frames
# run, or a plain dialog for `--setup` before the window exists. 0.17 is on
# objc2 0.6, as winit is; the product's 0.14 stays on its own copy.
rfd = "0.17.2"

# The intros' video (AB.10, design decision 7: AB.7's pick). `source` (the
# default) compiles OpenH264 with `cc`: no system library.
openh264 = "0.9.9"
mp4 = "0.14"
# bevy_audio's own copy (Cargo.lock): an intro's MP3 is opened once before
# Bevy gets it, since bevy_audio unwraps that open and a bad file would panic.
rodio = { version = "0.22", default-features = false, features = ["mp3"] }

# The physics seam (openspec AG.4, design decision 3): queries only, no solver.
# Pinned by rev because crates.io's newest avian3d (0.7.0, checked 2026-10-19)
# is on Bevy 0.19; `main` at 1070759 is "Update to Bevy 0.20 (#1084)", avian3d
# 0.8.0-dev on Bevy 0.20 and parry3d 0.31. Move to 0.8 from crates.io when it
# publishes. `3d` and `parry-f32` only: no debug renderer, picking, scene or
# mesh colliders.
avian3d = { git = "https://github.com/avianphysics/avian", rev = "1070759b2145dc078abedace91dc7fe78013a45c", default-features = false, features = [
    "3d",
    "parry-f32",
] }
guac-motion = { path = "../guac-motion" }
# The hero's drawn transform eased between fixed steps (AG.16, design decision
# 5): the copy avian3d already builds on, not a new crate.
bevy_transform_interpolation = { version = "0.6", default-features = false, features = ["std"] }
# The shots plugin (AE.29) and hero_view write their PNGs themselves; the
# version bevy_image already pulls.
image = { version = "0.25", default-features = false, features = ["png"] }

# Pads on macOS through Apple's GameController framework (openspec AG.53):
# AG.5 found gilrs connects an 8BitDo over Bluetooth there and reads nothing,
# while GameController reads every element. The objc2 family at the versions
# the tree already locks (objc2 0.6, its framework crates 0.3, block2 0.6);
# gilrs stays the pad source everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSRunLoop",
    "NSString",
] }
block2 = { version = "0.6.1", default-features = false, features = ["std"] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "GCAxis2DInput",
    "GCButtonElement",
    "GCController",
    "GCControllerAxisInput",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerElement",
    "GCControllerInput",
    "GCDevice",
    "GCDevicePhysicalInput",
    "GCDevicePhysicalInputState",
    "GCDevicePhysicalInputStateDiff",
    "GCDirectionPadElement",
    "GCExtendedGamepad",
    "GCInputNames",
    "GCLinearInput",
    "GCPhysicalInputElement",
    "GCPhysicalInputProfile",
    "GCPressedStateInput",
    "GCTypes",
] }

[dev-dependencies]
# The seam's shared test table, run through the Avian side (physics.rs).
guac-motion = { path = "../guac-motion", features = ["conformance"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }
tempfile = "3"
# The builders (SfoBuilder, the sample disc) for the setup and extraction tests.
guac-formats = { path = "../guac-formats", features = ["test-fixtures"] }
# The live GameController check prints the backend's own log lines.
tracing-subscriber = { workspace = true }

# The dev viewer (openspec AC.10, AE.10): Eruptor in the remaster or on
# `StandardMaterial`, at an oracle frame's camera; `test` runs its unit tests
# under `cargo test`.
[[example]]
name = "hero_view"
test = true

# AG.53's live check runs on the main thread, where GameController delivers
# its connections, so it's its own harness; it skips unless `-- --ignored`.
[[test]]
name = "live_gamecontroller"
harness = false

[features]
default = ["dev-tools"]
# `cargo run` builds: `./dev-data/guacamole/`, `.env.dev`, unsigned requests,
# a console window on Windows.
dev-tools = ["guac-server/dev-tools"]
# The /api/_test/* endpoints for the e2e harness. Never in release builds.
test-hooks = ["dev-tools", "guac-server/test-hooks"]
# AB.7's spike, kept out of `cargo test`: `cargo run --release -p guacamole
# --features video-spike --example video_spike` (the TV pass in
# openspec/backlog.md runs it on the TV, ex-AB.16).
video-spike = []

[[example]]
name = "video_spike"
required-features = ["video-spike"]
