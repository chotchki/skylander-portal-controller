[package]
name = "skylander-e2e-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
fantoccini = "0.21"
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
which = "6"
once_cell = "1"
tracing = { workspace = true }

# HMAC negative-test needs to craft signatures directly.
hmac = "0.12"
sha2 = { workspace = true }
hex = "0.4"
tokio-tungstenite = "0.24"
futures-util = "0.3"

# iOS-Simulator-driven tests (PLAN 10.4) link the standalone
# tools/ios-inspect crate as a library so the harness gets type-safe
# access to boot / open / wait_for_selector / screenshot. ios-inspect
# stays out of the workspace (it's still a standalone CLI tool with
# its own [workspace] block); Cargo handles path deps to outside-the-
# workspace crates fine. Macos-only since the underlying xcrun simctl
# + ios_webkit_debug_proxy stack only exists there.
[target.'cfg(target_os = "macos")'.dependencies]
ios-inspect = { path = "../../tools/ios-inspect" }
