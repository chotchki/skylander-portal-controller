[package]
name = "guac-formats"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Pure parsers over the byte formats on a disc dump (openspec AB, design
# decision 1): every parser takes `&[u8]`, does no I/O and bounds every length
# it reads before allocating. `guac-extract` owns the filesystem.
[lib]
name = "guac_formats"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
# Raw LZMA1 for IGA chunks (AB.3 records the pick over lzma-rs). Default
# features off: `optimization` is the one that turns on `unsafe`.
lzma-rust2 = { version = "0.23", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
# The IGA builder's LZMA encoder, for this crate's own unit tests.
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "encoder"] }
# The property harness (tests/properties.rs) needs the registry and the
# builders, which only exist under `test-fixtures`.
guac-formats = { path = ".", features = ["test-fixtures"] }

[features]
# Builders that write each format in code, plus the parser registry the
# property test and the fuzz targets walk. Test-only: other crates' tests
# (AA.5, AA.10) enable it from their [dev-dependencies]; nothing that ships does.
test-fixtures = ["lzma-rust2/encoder"]

[[example]]
name = "fuzz_seeds"
required-features = ["test-fixtures"]
