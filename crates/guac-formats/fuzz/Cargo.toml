[package]
name = "guac-formats-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# cargo-fuzz targets for guac-formats (openspec AB, design decision 3). Nightly
# only, so this is its own workspace and the root one excludes it. Run from
# crates/guac-formats: `cargo +nightly fuzz run <target>`, after seeding the
# corpus from the builders (`cargo run -p guac-formats --features test-fixtures
# --example fuzz_seeds`); unseeded, libFuzzer stalls at the magic.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
guac-formats = { path = "..", features = ["test-fixtures"] }
ktx2 = "0.5"

[workspace]
members = ["."]

# Every registered parser behind one target: the first byte picks the parser.
[[bin]]
name = "all_parsers"
path = "fuzz_targets/all_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "param_sfo"
path = "fuzz_targets/param_sfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iga"
path = "fuzz_targets/iga.rs"
test = false
doc = false
bench = false

[[bin]]
name = "igz"
path = "fuzz_targets/igz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "igz_layouts"
path = "fuzz_targets/igz_layouts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "igimage2_ktx2"
path = "fuzz_targets/igimage2_ktx2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edge_geometry"
path = "fuzz_targets/edge_geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roster"
path = "fuzz_targets/roster.rs"
test = false
doc = false
bench = false

[[bin]]
name = "toy_table"
path = "fuzz_targets/toy_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "havok"
path = "fuzz_targets/havok.rs"
test = false
doc = false
bench = false
