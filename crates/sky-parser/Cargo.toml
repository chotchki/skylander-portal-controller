[package]
name = "skylander-sky-parser"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "skylander_sky_parser"
path = "src/lib.rs"
# No doctests here, so `cargo test` skips the empty doc-test run (openspec AQ.36);
# a doc example meant to run drops this, and .githooks/no-doctests.sh fails the
# push until it does.
doctest = false

[dependencies]
skylander-core = { path = "../core" }
serde = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
aes = "0.8"
md-5 = "0.10"

[dev-dependencies]
serde_json = { workspace = true }
