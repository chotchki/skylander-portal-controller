[package]
name = "guac-ir"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The versioned IR guac-extract writes and guacamole reads (openspec AB, design
# decision 1): RON in dev so two extracts diff by eye, postcard in an install.
[lib]
name = "guac_ir"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
ron = "0.12"
postcard = { version = "1", default-features = false, features = ["use-std"] }
