[package]
name = "guac-ir"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The versioned IR guac-extract writes and guacamole reads (openspec AB, design
# decision 1): RON in dev so two extracts diff by eye, postcard in an install.
[lib]
name = "guac_ir"
path = "src/lib.rs"
# No doctests here, so `cargo test` skips the empty doc-test run (openspec AQ.36);
# a doc example meant to run drops this, and .githooks/no-doctests.sh fails the
# push until it does.
doctest = false

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
ron = "0.12"
postcard = { version = "1", default-features = false, features = ["use-std"] }
