[package]
name = "skylander-indexer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# No doctests here, so `cargo test` skips the empty doc-test run (openspec AQ.36);
# a doc example meant to run drops this, and .githooks/no-doctests.sh fails the
# push until it does.
doctest = false

[dependencies]
skylander-core = { path = "../core" }
skylander-sky-parser = { path = "../sky-parser" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
tracing = { workspace = true }
