[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/indexer",
    "crates/nfc-reader",
    "crates/rpcs3-control",
    "crates/server",
    "crates/sky-parser",
    "crates/e2e-tests",
    "tools/icon-bake",
    "tools/installer-bake",
    "tools/rekey-figure-ids",
    "tools/tailwind-build",
    "tools/wiki-scrape",
]
# tools/ios-inspect is a standalone Mac-only crate with its own
# [workspace] block — kept outside the root workspace so its
# clap/tokio-tungstenite/reqwest deps don't end up in every workspace
# build, AND so non-Mac contributors don't have to deal with its
# libc::setsid usage. The e2e-tests crate path-deps it via a
# target.cfg(target_os = "macos") dev-dependency (PLAN 10.4.2);
# `exclude` here tells Cargo "this directory is intentionally not
# a workspace member" so the path-dep doesn't trip the
# "multiple workspace roots" guard.
exclude = ["tools/ios-inspect"]
# Bare cargo commands from the repo root narrow to just the server, which
# has one bin (`skylander-portal-controller`). Without this, `cargo run`
# errors on bin-ambiguity vs the one-shot `skylander-wiki-scrape` tool.
# Note this also affects `cargo test` / `cargo build` / `cargo check` —
# use `--workspace` (or `-p <name>`) when you need the rest of the
# workspace. Wiki-scrape stays reachable via `cargo run -p skylander-wiki-scrape`.
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
# GPL-2.0-only to match RPCS3: the Phase-16 patch series (rpcs3-patches/) is a
# derivative of RPCS3's GPLv2 source, so the combined work is GPL-2.0. See /LICENSE.
license = "GPL-2.0-only"

[workspace.dependencies]
# Shared across multiple crates. Version bumps happen here.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
walkdir = "2"
