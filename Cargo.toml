[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/guac-extract",
    "crates/guac-formats",
    "crates/guac-ir",
    "crates/guac-server",
    "crates/guacamole",
    "crates/indexer",
    "crates/rpcs3-control",
    "crates/server",
    "crates/sky-parser",
    "crates/e2e-tests",
    "tools/brand-bake",
    "tools/icon-bake",
    "tools/playthrough",
    "tools/rekey-figure-ids",
    "tools/rrc-dump",
    "tools/tailwind-build",
    "tools/wiki-scrape",
]
# cargo-fuzz targets build on nightly with sanitizer flags, so they're their own
# workspace (openspec AB, design decision 3); the stable property test in
# guac-formats is what `cargo test --workspace` runs.
exclude = ["crates/guac-formats/fuzz"]
# Bare cargo commands from the repo root narrow to the server, which has
# one bin (`skylander-portal-controller`), plus the guac-server library it
# links (no bin, so `cargo run` stays unambiguous). Without this, `cargo run`
# errors on bin-ambiguity vs the one-shot `skylander-wiki-scrape` tool.
# Note this also affects `cargo test` / `cargo build` / `cargo check` —
# use `--workspace` (or `-p <name>`) when you need the rest of the
# workspace. Wiki-scrape stays reachable via `cargo run -p skylander-wiki-scrape`.
default-members = ["crates/server", "crates/guac-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
# GPL-2.0-only to match RPCS3: the Phase-16 patch series (rpcs3-patches/) is a
# derivative of RPCS3's GPLv2 source, so the combined work is GPL-2.0. See /LICENSE.
license = "GPL-2.0-only"

[workspace.dependencies]
# Shared across multiple crates. Version bumps happen here.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
walkdir = "2"

# Intros decode on a thread of their own. At opt-level 0 OpenH264 (C, which cc
# builds at the profile's level) and its YUV to RGBA kept a debug guacamole
# near 7 fps on a 640x360 clip (AB.11's e2e); optimized, they keep pace.
[profile.dev.package.openh264]
opt-level = 3

[profile.dev.package.openh264-sys2]
opt-level = 3
